<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BookSwap — книги находят своих людей">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7f2" />
      <stop offset="1" stop-color="#efe9dd" />
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284a9d" />
      <stop offset="1" stop-color="#90b0ec" />
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b65c26" />
      <stop offset="1" stop-color="#f2bc77" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)" />
  <circle cx="1010" cy="120" r="210" fill="#dfe9ff" opacity="0.75" />
  <circle cx="150" cy="560" r="170" fill="#ffe8c4" opacity="0.7" />
  <g transform="translate(760 150) rotate(6)">
    <rect width="300" height="400" rx="26" fill="url(#cover)" />
    <text x="34" y="66" font-family="Georgia, serif" font-size="22" fill="#eef3ff" opacity="0.85">BOOK</text>
    <text x="34" y="150" font-family="Georgia, serif" font-size="46" fill="#ffffff">Book</text>
    <text x="34" y="200" font-family="Georgia, serif" font-size="46" fill="#ffffff">Swap</text>
    <text x="34" y="352" font-family="Georgia, serif" font-size="18" fill="#e6eeff" opacity="0.8">BookSwap edition</text>
  </g>
  <g transform="translate(660 300) rotate(-9)">
    <rect width="210" height="300" rx="20" fill="url(#warm)" opacity="0.92" />
  </g>
  <text x="80" y="170" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="26" letter-spacing="4" fill="#8a877e">КНИЖНОЕ СООБЩЕСТВО</text>
  <text x="80" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="74" font-weight="700" fill="#17171a">Книги находят</text>
  <text x="80" y="355" font-family="Georgia, serif" font-size="76" font-style="italic" fill="#6f6c64">своих людей.</text>
  <text x="80" y="425" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="27" fill="#5f5c55">Покупайте, обменивайтесь и отдавайте книги бесплатно.</text>
  <g transform="translate(80 470)">
    <rect width="230" height="62" rx="31" fill="#17171a" />
    <text x="38" y="40" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Найти книгу →</text>
  </g>
</svg>
